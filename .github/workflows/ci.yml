name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:


concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# env:
#   YARN_ENABLE_GLOBAL_CACHE: false
#   YARN_CACHE_FOLDER: .yarn/cache


jobs:
